name: Five67
options:
  bundleIdPrefix: com.nopal
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.nopal.five67
    DEVELOPMENT_TEAM: "[redacted-team]"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Five67:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Five67
    resources:
      - path: Five67/Resources/Assets.xcassets
      - path: Five67/Resources/PrivacyInfo.xcprivacy
    info:
      path: Five67/Resources/Info.plist
      properties:
        CFBundleName: Five67
        CFBundleDisplayName: Five67
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        NSPhotoLibraryUsageDescription: "Five67 needs access to your library to import practice videos."
        NSSupportsLiveActivities: false
    settings:
      base:
        INFOPLIST_FILE: Five67/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
