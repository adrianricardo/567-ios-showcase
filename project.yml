name: Five67
options:
  bundleIdPrefix: com.nopal
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.nopal.five67
    DEVELOPMENT_TEAM: "[redacted-team]"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Five67:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Five67
    resources:
      - path: Five67/Resources/Assets.xcassets
      - path: Five67/Resources/PrivacyInfo.xcprivacy
    info:
      path: Five67/Resources/Info.plist
      properties:
        CFBundleName: "567"
        CFBundleDisplayName: "567"
        CFBundleShortVersionString: "1.0.2"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        NSPhotoLibraryUsageDescription: "567 needs access to your library to import practice videos."
        NSSupportsLiveActivities: false
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        INFOPLIST_FILE: Five67/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "[redacted-team]"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
    postBuildScripts:
      - name: Set CFBundleVersion from git commit count
        script: |
          set -e
          buildNumber=$(cd "$PROJECT_DIR" && git rev-list --count HEAD 2>/dev/null || echo "1")
          infoPlist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ -f "$infoPlist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $buildNumber" "$infoPlist"
            echo "CFBundleVersion set to $buildNumber"
          fi
        basedOnDependencyAnalysis: false

  Five67Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Five67Tests
    dependencies:
      - target: Five67
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nopal.five67.tests
        DEVELOPMENT_TEAM: "[redacted-team]"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Five67:
    build:
      targets:
        Five67: all
        Five67Tests: [test]
    test:
      targets:
        - Five67Tests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
