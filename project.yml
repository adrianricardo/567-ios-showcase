name: Five67
options:
  bundleIdPrefix: com.nopal
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.nopal.five67
    DEVELOPMENT_TEAM: "HML25PC4DU"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Five67:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Five67
        excludes:
          - Resources/StoreKit
    resources:
      - path: Five67/Resources/Assets.xcassets
      - path: Five67/Resources/PrivacyInfo.xcprivacy
    dependencies:
      # Xcode represents the In-App Purchase capability by explicitly linking
      # StoreKit. Keep this in the XcodeGen source of truth so regeneration
      # does not silently remove the capability before an archive.
      - sdk: StoreKit.framework
    info:
      path: Five67/Resources/Info.plist
      properties:
        CFBundleName: "567"
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        CFBundleShortVersionString: "1.0.3"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: false
        NSSupportsLiveActivities: false
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        INFOPLIST_FILE: Five67/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "HML25PC4DU"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        APP_DISPLAY_NAME: "567"
      # Debug builds get their own bundle ID + name so a local dev build installs
      # beside the App Store / TestFlight build instead of replacing it.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.nopal.five67.dev
          APP_DISPLAY_NAME: "567 Dev"
    postBuildScripts:
      - name: Set CFBundleVersion from git commit count
        script: |
          set -e
          buildNumber=$(cd "$PROJECT_DIR" && git rev-list --count HEAD 2>/dev/null || echo "1")
          infoPlist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ -f "$infoPlist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $buildNumber" "$infoPlist"
            echo "CFBundleVersion set to $buildNumber"
          fi
        basedOnDependencyAnalysis: false

  Five67Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Five67Tests
      - path: Five67Tests/Resources/Five67Tests.storekit
        buildPhase: resources
    dependencies:
      - target: Five67
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nopal.five67.tests
        DEVELOPMENT_TEAM: "HML25PC4DU"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: "YES"

  Five67UITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Five67UITests
    dependencies:
      - target: Five67
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nopal.five67.uitests
        DEVELOPMENT_TEAM: "HML25PC4DU"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Five67:
    build:
      targets:
        Five67: all
        Five67Tests: [test]
    test:
      targets:
        - Five67Tests
        - Five67UITests
      gatherCoverageData: true
    run:
      config: Debug
      storeKitConfiguration: Five67/Resources/StoreKit/Five67.storekit
    archive:
      config: Release

  Five67StoreKit:
    build:
      targets:
        Five67: all
        Five67Tests: [test]
    test:
      targets:
        - Five67Tests
      environmentVariables:
        FIVE67_RUN_STOREKIT_TESTS: "1"
    run:
      config: Debug
      storeKitConfiguration: Five67/Resources/StoreKit/Five67.storekit
