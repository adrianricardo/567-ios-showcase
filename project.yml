name: CumbiaMoves
options:
  bundleIdPrefix: com.enzo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.enzo.cumbiamoves
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  CumbiaMoves:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CumbiaMoves
    resources:
      - path: CumbiaMoves/Resources/Assets.xcassets
    info:
      path: CumbiaMoves/Resources/Info.plist
      properties:
        CFBundleName: Cumbia Moves
        CFBundleDisplayName: Cumbia Moves
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        NSPhotoLibraryUsageDescription: "Cumbia Moves needs access to your library to import practice videos."
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: false
    settings:
      base:
        INFOPLIST_FILE: CumbiaMoves/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
